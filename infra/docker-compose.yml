# Infra de développement : Postgres + pgvector, Redis, MinIO (stockage média S3-compatible).
# Usage : docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
      POSTGRES_DB: task
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: task
      MINIO_ROOT_PASSWORD: tasktask
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
volumes:
  pgdata:
  minio:
